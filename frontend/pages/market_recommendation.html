<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Market Recommendation</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>AgriLink Uganda</h1></header>
<nav><a href="index.html">Home</a></nav>
<main>
    <h2>Market Price Recommendation</h2>
    <form id="recForm">
        <label>Commodity ID</label>
        <input type="number" id="commodity_id" required>

        <label>Your District ID</label>
        <input type="number" id="district_id" required>

        <button type="submit">Get Recommendations</button>
    </form>
    <div id="msg" class="message" style="display:none;"></div>

    <table id="recTable" style="display:none;">
        <thead>
            <tr><th>Market</th><th>Price/Unit</th><th>Transport Cost</th><th>Net Value</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script>
const session = getSession();
if (session && session.district_id) {
    document.getElementById("district_id").value = session.district_id;
}

document.getElementById("recForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const table = document.getElementById("recTable");
    try {
        const data = await apiGet("recommend_market.php", {
            commodity_id: document.getElementById("commodity_id").value,
            district_id: document.getElementById("district_id").value
        });

        const tbody = table.querySelector("tbody");
        tbody.innerHTML = "";

        if (!data.recommendations.length) {
            table.style.display = "none";
            showMessage(msg, "No price data found for that commodity yet.", "error");
            return;
        }

        data.recommendations.forEach(r => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${r.market_name}</td><td>${r.price_per_unit}</td><td>${r.transport_cost}</td><td>${r.net_value}</td>`;
            tbody.appendChild(row);
        });
        table.style.display = "table";
        msg.style.display = "none";
    } catch (err) {
        showMessage(msg, err.message, "error");
    }
});
</script>
</body>
</html>
